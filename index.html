    .route-panel {

    .route-steps li {

    }

    .route-step-sub {
      font-size: 12px;
      color: #555;
    }

      margin-top: 10px;

      gap: 8px;
      flex-wrap: wrap;
    }

function closeActivePopup() {
  if (activePopup) {
    activePopup.remove();
    activePopup = null;
  }
}

function safeJsonParse(value, fallback = null) {
  if (value == null) return fallback;
  if (typeof value !== "string") return value;
  try {
    return JSON.parse(value);
  } catch {
    return fallback;
  }
}

function normalizeRoutesFromStopProperties(properties) {
  const rawRoutes = safeJsonParse(properties.routes, properties.routes);
  if (!Array.isArray(rawRoutes)) return [];

  const routes = rawRoutes.map(route => ({
    ref: String(route?.ref ?? "").trim(),
    name: String(route?.name ?? "").trim(),
    variants: Array.isArray(route?.variants)
      ? route.variants.map(v => ({
          relation_id: String(v?.relation_id ?? "").trim(),
          from: String(v?.from ?? "").trim(),
          to: String(v?.to ?? "").trim(),
          name: String(v?.name ?? "").trim()
        }))
      : []
  })).filter(route => route.ref || route.variants.length);

  routes.sort((a, b) => {
    const ra = a.ref || "";
    const rb = b.ref || "";
    return ra.localeCompare(rb, "de", { numeric: true });
  });

  return routes;
}

function clearAllHighlights() {
  for (const mode of Object.values(MODES)) {
    const source = map.getSource(mode.routeHighlightSourceId);
    if (!source) continue;

    source.setData({
      type: "FeatureCollection",
      features: []
    });
  }
}

function fitToFeatures1(features) {
  if (!features.length) return;

  const bounds = new maplibregl.LngLatBounds();
  let hasCoords = false;

  function extendCoords(coords) {
    for (const c of coords) {
      if (Array.isArray(c[0])) {
        extendCoords(c);
      } else {
        bounds.extend(c);
        hasCoords = true;
      }
    }
  }

  for (const feature of features) {
    if (feature.geometry?.coordinates) {
      extendCoords(feature.geometry.coordinates);
    }
  }

  if (hasCoords) {
    map.fitBounds(bounds, {
      padding: 60,
      maxZoom: 15,
      duration: 500
    });
  }
}

function fitToFeatures(features) {
  if (!features.length) return;

  const bounds = new maplibregl.LngLatBounds();
  let hasCoords = false;

  function extendGeometry(geometry) {
    if (!geometry || !geometry.coordinates) return;

    const { type, coordinates } = geometry;

    if (type === "Point") {
      bounds.extend(coordinates);
      hasCoords = true;
      return;
    }

    if (type === "MultiPoint" || type === "LineString") {
      for (const coord of coordinates) {
        bounds.extend(coord);
        hasCoords = true;
      }
      return;
    }

    if (type === "MultiLineString" || type === "Polygon") {
      for (const part of coordinates) {
        for (const coord of part) {
          bounds.extend(coord);
          hasCoords = true;
        }
      }
      return;
    }

    if (type === "MultiPolygon") {
      for (const polygon of coordinates) {
        for (const ring of polygon) {
          for (const coord of ring) {
            bounds.extend(coord);
            hasCoords = true;
          }
        }
      }
    }
  }

  for (const feature of features) {
    extendGeometry(feature.geometry);
  }

  if (hasCoords) {
    map.fitBounds(bounds, {
      padding: 60,
      maxZoom: 15,
      duration: 500
    });
  }
}

function showRouteHighlightByRelation(routeType, relationId) {
  const mode = MODES[routeType];
  if (!mode) {
    console.warn("Unbekannter routeType:", routeType);
    return;
  }

  const allRoutes = routeDataByMode[routeType];
  if (!allRoutes || !Array.isArray(allRoutes.features)) {
    console.warn("Keine Routendaten geladen für:", routeType);
    return;
  }

  const normalizedRelationId = String(relationId ?? "").trim();

  const matches = allRoutes.features.filter(feature => {
    const osmId = String(feature?.properties?.osm_id ?? "").trim();
    return osmId === normalizedRelationId;
  });

  const source = map.getSource(mode.routeHighlightSourceId);
  if (!source) {
    console.warn("Highlight-Source fehlt:", mode.routeHighlightSourceId);
    return;
  }

  clearAllHighlights();

  source.setData({
    type: "FeatureCollection",
    features: matches
  });

  fitToFeatures(matches);
}

function showRouteHighlightByRef(routeType, routeRef) {
  const mode = MODES[routeType];
  if (!mode) {
    console.warn("Unbekannter routeType:", routeType);
    return;
  }

  const allRoutes = routeDataByMode[routeType];
  if (!allRoutes || !Array.isArray(allRoutes.features)) {
    console.warn("Keine Routendaten geladen für:", routeType);
    return;
  }

  const normalizedRef = String(routeRef ?? "").trim().toLowerCase();

  const matches = allRoutes.features.filter(feature => {
    const ref = String(feature?.properties?.ref ?? "").trim().toLowerCase();
    return ref === normalizedRef;
  });

  const source = map.getSource(mode.routeHighlightSourceId);
  if (!source) {
    console.warn("Highlight-Source fehlt:", mode.routeHighlightSourceId);
    return;
  }

  clearAllHighlights();

  source.setData({
    type: "FeatureCollection",
    features: matches
  });

  fitToFeatures(matches);
}

function buildPopupContent(feature) {
  const properties = feature.properties || {};
  const stopName =
    properties.name ||
    properties.local_ref ||
    properties.ref ||
    "Haltestelle";

  const routeType = String(properties.route_type || "").trim().toLowerCase();
  const mode = MODES[routeType];
  const routes = normalizeRoutesFromStopProperties(properties);

  const wrapper = document.createElement("div");

  const title = document.createElement("div");
  title.className = "popup-stop-name";
  title.textContent = stopName;
  wrapper.appendChild(title);

  const subtitle = document.createElement("div");
  subtitle.className = "popup-subtitle";
  subtitle.textContent = `${mode ? mode.label : routeType}-Linien`;
  wrapper.appendChild(subtitle);

  if (!routes.length) {
    const empty = document.createElement("div");
    empty.textContent = "Keine Linieninformationen vorhanden.";
    wrapper.appendChild(empty);
    return wrapper;
  }

  const list = document.createElement("ul");
  list.className = "route-list";

  for (const route of routes) {
    if (route.variants && route.variants.length) {
      for (const variant of route.variants) {
        const li = document.createElement("li");
        const btn = document.createElement("button");

        btn.type = "button";
        btn.className = "route-link";

        const label = route.ref
          ? `${route.ref}: ${variant.from || "?"} → ${variant.to || "?"}`
          : `${variant.from || "?"} → ${variant.to || "?"}`;

        btn.textContent = label;
        btn.setAttribute("data-route-type", routeType);
        btn.setAttribute("data-relation-id", variant.relation_id || "");

        li.appendChild(btn);
        list.appendChild(li);
      }
    } else {
      const li = document.createElement("li");
      const btn = document.createElement("button");

      btn.type = "button";
      btn.className = "route-link";
      btn.textContent = route.ref || route.name || "(ohne Bezeichnung)";
      btn.setAttribute("data-route-type", routeType);
      btn.setAttribute("data-route-ref", route.ref || "");

      li.appendChild(btn);
      list.appendChild(li);
    }
  }

  wrapper.appendChild(list);

  wrapper.addEventListener("click", (event) => {
    const relationBtn = event.target.closest("[data-route-type][data-relation-id]");
    if (relationBtn) {
      event.preventDefault();
      event.stopPropagation();

      const clickedRouteType = relationBtn.getAttribute("data-route-type");
      const relationId = relationBtn.getAttribute("data-relation-id");

      showRouteHighlightByRelation(clickedRouteType, relationId);
      return;
    }

    const refBtn = event.target.closest("[data-route-type][data-route-ref]");
    if (refBtn) {
      event.preventDefault();
      event.stopPropagation();

      const clickedRouteType = refBtn.getAttribute("data-route-type");
      const clickedRouteRef = refBtn.getAttribute("data-route-ref");

      showRouteHighlightByRef(clickedRouteType, clickedRouteRef);
    }
  });

  return wrapper;
}

function openStopPopup(feature, lngLat) {
  closeActivePopup();

  activePopup = new maplibregl.Popup({
    closeButton: true,
    closeOnClick: false
  })
    .setLngLat(lngLat)
    .setDOMContent(buildPopupContent(feature))
    .addTo(map);
}

async function loadJson(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`Fehler beim Laden von ${url}: HTTP ${response.status}`);
  }
  return await response.json();
}

function addModeLayers(modeKey, stopsGeojson, routesGeojson) {
  const mode = MODES[modeKey];
  routeDataByMode[modeKey] = routesGeojson;

  map.addSource(mode.stopSourceId, {
    type: "geojson",
    data: stopsGeojson
  });

  map.addSource(mode.routeHighlightSourceId, {
    type: "geojson",
    data: {
      type: "FeatureCollection",
      features: []
    }
  });

  map.addLayer({
    id: mode.routeHighlightLayerId,
    type: "line",
    source: mode.routeHighlightSourceId,
    layout: {
      "line-cap": "round",
      "line-join": "round"
    },
    paint: {
      "line-color": mode.color,
      "line-width": [
        "interpolate", ["linear"], ["zoom"],
        10, 3,
        14, 5,
        18, 8
      ],
      "line-opacity": 0.95
    }
  });

  map.addLayer({
    id: mode.stopLayerId,
    type: "circle",
    source: mode.stopSourceId,
    paint: {
      "circle-radius": [
        "interpolate", ["linear"], ["zoom"],
        10, 3,
        14, 5,
        18, 7
      ],
      "circle-color": mode.color,
      "circle-stroke-width": 1.2,
      "circle-stroke-color": "#ffffff"
    }
  });

  map.on("click", mode.stopLayerId, (e) => {
    if (!e.features || !e.features.length) return;
    openStopPopup(e.features[0], e.lngLat);
  });

  map.on("mouseenter", mode.stopLayerId, () => {
    map.getCanvas().style.cursor = "pointer";
  });

  map.on("mouseleave", mode.stopLayerId, () => {
    map.getCanvas().style.cursor = "";
  });
}

    id: "pt-route-line-layer",
    type: "line",
    source: "pt-route-line-source",
    layout: {
      "line-cap": "round",
      "line-join": "round"
    },
    paint: {
      "line-color": [
        "case",
        ["==", ["get", "leg_type"], "ride"],
        [
          "match",
          ["get", "route_type"],
          "bus", "#e30000",
          "tram", "#0066dd",
          "subway", "#009966",
          "train", "#7a3db8",
          "#444444"
        ],
        "#555555"
      ],
      "line-width": [
        "case",
        ["==", ["get", "leg_type"], "ride"], 6,
        4
      ],
      "line-dasharray": [
        "case",
        ["in", ["get", "leg_type"], ["literal", ["access", "egress", "transfer"]]],
        ["literal", [2, 2]],
        ["literal", [1, 0]]
      ],
      "line-opacity": 0.92
    }
  });

  map.addLayer({
    id: "pt-route-points-layer",
    type: "circle",
    source: "pt-route-points-source",
    paint: {
      "circle-radius": 5,
      "circle-color": "#111111",
      "circle-stroke-color": "#ffffff",
      "circle-stroke-width": 1.5
    }
  });
}

function clearPtRoute() {
  currentPtRouteResponse = null;

  const lineSource = map.getSource("pt-route-line-source");
  if (lineSource) {
    lineSource.setData({ type: "FeatureCollection", features: [] });
  }

  const pointSource = map.getSource("pt-route-points-source");
  if (pointSource) {
    pointSource.setData({ type: "FeatureCollection", features: [] });
  }

  updateRoutePanel(null);
}

function resetRoutingSelection() {
  startPoint = null;
  endPoint = null;

  if (startMarker) {
    startMarker.remove();
    startMarker = null;
  }

  if (endMarker) {
    endMarker.remove();
    endMarker = null;
  }

  clearPtRoute();
}

function formatDistance(m) {
  if (m == null || Number.isNaN(Number(m))) return "–";
  const value = Number(m);
  if (value < 1000) return `${Math.round(value)} m`;
  return `${(value / 1000).toFixed(1)} km`;
}

function buildLegLabel(edge) {
  const type = edge?.type;

  if (type === "access") {
    return `Zu Fuß zur Station ${edge.to_stop_name || ""}`.trim();
  }

  if (type === "egress") {
    return `Zu Fuß von ${edge.from_stop_name || "der Station"} zum Ziel`;
  }

  if (type === "transfer") {
    return `Umstieg / Fußweg: ${edge.from_stop_name || "?"} → ${edge.to_stop_name || "?"}`;
  }

  if (type === "ride") {
    const rt = edge.route_type === "subway" ? "U-Bahn" :
               edge.route_type === "tram" ? "Tram" :
               edge.route_type === "train" ? "Zug" :
               edge.route_type === "bus" ? "Bus" :
               edge.route_type || "Linie";

    const ref = edge.ref ? ` ${edge.ref}` : "";
    return `${rt}${ref}: ${edge.from_stop_name || "?"} → ${edge.to_stop_name || "?"}`;
  }

  return `${type || "Unbekannt"}: ${edge.from_stop_name || "?"} → ${edge.to_stop_name || "?"}`;
}

function updateRoutePanel(data) {
  const container = document.getElementById("route-panel-content");

  if (!data || !Array.isArray(data.edges) || !data.edges.length) {
    container.innerHTML = `<div class="route-panel-empty">Noch keine Route gewählt.</div>`;
    return;
  }

  const summary = data.summary || {};

  const stepsHtml = data.edges.map(edge => {
    const label = buildLegLabel(edge);
    const routeMeta = edge.route_name
      ? `<div class="route-step-sub">${edge.route_name}</div>`
      : "";
    const distMeta = `<div class="route-step-meta">${formatDistance(edge.distance_m)}</div>`;

    return `<li><div>${label}</div>${routeMeta}${distMeta}</li>`;
  }).join("");

  container.innerHTML = `
    <div class="route-summary">
      Fahrt: ${formatDistance(summary.ride_m)}<br>
      Umstieg: ${formatDistance(summary.transfer_m)}<br>
      Zuweg: ${formatDistance(summary.access_m)}<br>
      Abweg: ${formatDistance(summary.egress_m)}
    </div>
    <ol class="route-steps">${stepsHtml}</ol>
  `;
}

async function loadPtRoute1(startLngLat, endLngLat) {
  const url = `${PT_ROUTER_URL}?start=${startLngLat.lng},${startLngLat.lat}&end=${endLngLat.lng},${endLngLat.lat}`;

  try {
    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      console.error("PT routing error:", data);
      updateRoutePanel(null);
      alert(data?.error || "Öffi-Route konnte nicht berechnet werden.");
      return;
    }

    currentPtRouteResponse = data;

    const lineSource = map.getSource("pt-route-line-source");
    if (lineSource) {
      lineSource.setData(
        data.route_line || { type: "FeatureCollection", features: [] }
      );
    }

    const pointSource = map.getSource("pt-route-points-source");
    if (pointSource) {
      pointSource.setData(
        data.route_points || { type: "FeatureCollection", features: [] }
      );
    }

    updateRoutePanel(data);

    const features = [
      ...((data.route_line && data.route_line.features) || []),
      ...((data.route_points && data.route_points.features) || [])
    ];
    fitToFeatures(features);
  } catch (error) {
    console.error("Fehler beim Laden der Öffi-Route:", error);
    updateRoutePanel(null);
    alert("Öffi-Route konnte nicht geladen werden.");
  }
}

async function loadPtRoute(startLngLat, endLngLat) {
  const url = `${PT_ROUTER_URL}?start=${startLngLat.lng},${startLngLat.lat}&end=${endLngLat.lng},${endLngLat.lat}`;

  try {
    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      console.error("PT routing error:", data);
      updateRoutePanel(null);
      alert(data?.error || "Öffi-Route konnte nicht berechnet werden.");
      return;
    }

    currentPtRouteResponse = data;

    const lineSource = map.getSource("pt-route-line-source");
    if (lineSource) {
      lineSource.setData(
        data.route_line || { type: "FeatureCollection", features: [] }
      );
    }

    if (pointSource) {
      pointSource.setData(
        data.route_points || { type: "FeatureCollection", features: [] }
      );

}

function handleMapRoutingClick(lngLat) {
  if (!startPoint) {
    startPoint = lngLat;
    startMarker = new maplibregl.Marker({ color: "green" })
      .setLngLat(startPoint)
      .setPopup(new maplibregl.Popup({ offset: 25 }).setText("Start"))
      .addTo(map);
    return;
  }

  if (!endPoint) {
    endPoint = lngLat;
    endMarker = new maplibregl.Marker({ color: "red" })
      .setLngLat(endPoint)
      .setPopup(new maplibregl.Popup({ offset: 25 }).setText("Ziel"))
      .addTo(map);

    loadPtRoute(startPoint, endPoint);
    return;
  }

  resetRoutingSelection();

  startPoint = lngLat;
  startMarker = new maplibregl.Marker({ color: "green" })
    .setLngLat(startPoint)
    .setPopup(new maplibregl.Popup({ offset: 25 }).setText("Start"))
    .addTo(map);
}

document.getElementById("clear-route-btn").addEventListener("click", () => {
  resetRoutingSelection();
});

map.on("load", async () => {
  try {
    
	
	for (const [modeKey, mode] of Object.entries(MODES)) {
      const [stopsGeojson, routesGeojson] = await Promise.all([
        loadJson(mode.stopsUrl),
        loadJson(mode.routesUrl)
      ]);

      addModeLayers(modeKey, stopsGeojson, routesGeojson);
    }
	
	
    addPtRoutingLayers();

    map.on("click", (e) => {
      const stopLayerIds = Object.values(MODES).map(mode => mode.stopLayerId);
      const highlightLayerIds = Object.values(MODES).map(mode => mode.routeHighlightLayerId);

      const hits = map.queryRenderedFeatures(e.point, {
        layers: [...stopLayerIds, ...highlightLayerIds]
      });

      if (!hits.length) {
        closeActivePopup();
        clearAllHighlights();
        handleMapRoutingClick(e.lngLat);
      }
    });

    console.log("Öffi-Daten geladen.");
  } catch (error) {
    console.error(error);
  }
});
